name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Configure this environment under the PyPI project's trusted publishers:
    #   owner: mxmlnkn, repository: mfusepy, workflow: python-publish.yml, environment: pypi
    environment:
      name: pypi
      url: https://pypi.org/p/mfusepy
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Distributions
        run: python3 -m build

      - name: Check Distributions
        run: twine check dist/*

      # Trusted Publishing automatically generates and uploads the PEP 740 attestations in the
      # official pypa/gh-action-pypi-publish action; no manual Sigstore/SLSA script is needed.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
          verify-metadata: false
          print-hash: true
          skip-existing: true
