name: Header Layout Matrix

on:
  # Manual because upstream headers and the ctypes definitions change rarely.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev gcc

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Download Public Headers
        run: tests/headers/download.sh all

      - name: Verify Downloaded Header Layouts
        run: python -m pytest -q tests/test_struct_layout_headers.py -rs
