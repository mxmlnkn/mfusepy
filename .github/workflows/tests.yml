name: Tests

on:
  push:
    branches: '**'
    tags-ignore: '**'
  pull_request:

jobs:
  Static-Code-Checks:
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Configure uv package age policy
        run: |
          echo "UV_EXCLUDE_NEWER=7 days" >> "$GITHUB_ENV"
          echo "UV_SYSTEM_PYTHON=1" >> "$GITHUB_ENV"

      - name: Reject AI co-authorship
        if: github.event_name == 'pull_request'
        run: |
          if git log \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --format='%B' |
            grep -Eiq \
              '^Co-Authored-By:.*<(.*@)?(anthropic\.com|openai\.com|google\.com|github\.com|amazon\.com|cursor\.com|cline\.bot|windsurf\.com|devin\.ai)>[[:space:]]*$'
          then
            echo "::error::AI co-authorship attribution is not permitted."
            echo "::error::AI tools may be used, but the merge request creator must take full responsibility for the submitted work."
            echo "::error::AI systems cannot assume responsibility for the changes and therefore must not be represented as co-authors."
            echo "::error::Co-authorship attribution is considered promotional/advertising content and is prohibited by repository policy."
            exit 1
          fi

      - name: Install Dependencies
        run: |
          # The dependencies are declared in [dependency-groups] in pyproject.toml.
          # The test and example dependencies are needed so that pylint can resolve their imports in tests/.
          uv pip install --group dev

      - name: Style Check With Ruff
        run: |
          ruff check --config tests/.ruff.toml -- $( git ls-tree -r --name-only HEAD | 'grep' -E '[.]py$' )

      - name: Style Check With Black
        run: |
          black -q --diff --line-length 120 --skip-string-normalization $( git ls-tree -r --name-only HEAD | 'grep' -E '[.]py$' ) > black.diff
          if [ -s black.diff ]; then
              cat black.diff
              exit 123
          fi

      - name: Lint With Codespell
        run: |
          codespell $( git ls-tree -r --name-only HEAD | 'grep' -E '[.](py|md|txt|sh|yml)$' )

      - name: Lint With Flake8
        run: |
          flake8 --config tests/.flake8 $( git ls-tree -r --name-only HEAD | 'grep' -E '[.]py$' )

      - name: Security Lint With Bandit
        run: |
          # Only report medium and higher severity issues and scan the library and the examples.
          bandit -q -r -ll mfusepy.py examples

      - name: Lint With Pylint
        run: |
          pylint --rcfile tests/.pylintrc $( git ls-tree -r --name-only HEAD | 'grep' -E '[.]py$' ) | tee pylint.log
          ! 'egrep' ': E[0-9]{4}: ' pylint.log

      - name: Lint With Pytype
        run: |
          pytype -d import-error $( git ls-tree -r --name-only HEAD | 'grep' -E '[.]py$' )

      - name: Lint With Mypy
        run: |
          mypy --config-file tests/.mypy.ini $( git ls-tree -r --name-only HEAD | 'grep' -E '[.]py$' )

  Tests:
    runs-on: ${{ matrix.os }}

    strategy:
      # Let all jobs finish, so one can see which platforms are affected by a failure.
      fail-fast: false
      matrix:
        # https://endoflife.date/python
        include:
          - os: ubuntu-22.04
            python-version: '3.9'
          - os: ubuntu-22.04-arm
            python-version: '3.10'
          - os: ubuntu-22.04
            python-version: '3.11'
          - os: ubuntu-24.04
            python-version: '3.11'
          - os: ubuntu-24.04-arm
            python-version: '3.12'
          - os: ubuntu-24.04
            python-version: '3.13'
          - os: ubuntu-24.04
            python-version: '3.14'
          - os: ubuntu-26.04-arm
            python-version: '3.14'
          - os: ubuntu-26.04
            python-version: '3.15'
          - os: macos-14
            python-version: '3.10'
          - os: macos-15-intel
            python-version: '3.11'
          - os: macos-14
            python-version: '3.12'
          - os: macos-15-intel
            python-version: '3.13'
          - os: macos-15
            python-version: '3.14'
          - os: macos-26
            python-version: '3.11'
          - os: macos-26
            python-version: '3.12'
          - os: macos-26-intel
            python-version: '3.13'

    env:
      MFUSEPY_CHECK_OVERRIDES: 1
    defaults:
      run:
        # This is especially important for windows because it seems to default to powershell
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          # We need one tag for testing the git mount.
          # This is BROKEN! God damn it. Is anything working at all...
          # https://github.com/actions/checkout/issues/1781
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Only has an effect for Python versions without a stable release yet.
          allow-prereleases: true
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Configure uv package age policy
        run: |
          echo "UV_EXCLUDE_NEWER=7 days" >> "$GITHUB_ENV"
          echo "UV_SYSTEM_PYTHON=1" >> "$GITHUB_ENV"

      - name: Install Dependencies (Linux)
        if: startsWith( matrix.os, 'ubuntu' )
        run: |
          sudo apt-get -y install libfuse2 libfuse-dev libfuse3-dev fuse3 wget

      - name: Install Dependencies (MacOS)
        if: startsWith( matrix.os, 'macos' )
        run: |
          brew install -q macfuse

      - name: Install pip Dependencies
        run: |
          # The build, test, and example dependencies are declared in [dependency-groups] in pyproject.toml.
          # https://github.com/pyca/pynacl/issues/839
          # https://github.com/pyca/pynacl/pull/848
          # pynacl no longer needs to be installed from git master for Python 3.14:
          # pynacl 1.6.0 (2025-09) is on PyPI and contains the typing.ByteString fix of PR 848.
          #python3 -m pip install --upgrade git+https://github.com/pyca/pynacl.git
          uv pip install --upgrade --group build --group test --group examples

      - name: Test Installation From Tarball
        run: |
          python3 -m build
          twine check dist/*
          uv pip install "$( find dist -name '*.tar.gz' | head -1 )"

      - name: Test Installation From Source
        run: |
          uv pip install .

      - name: Test Import
        run: |
          python3 -c 'import mfusepy'

      - name: Examples
        run: |
          # Simply parsing the source runs the @overrides check!
          for file in examples/*.py; do
              python3 "$file" -h
          done

      - name: Only test struct layout (MacOS)
        if: startsWith( matrix.os, 'macos' )
        run: |
          python3 -m pytest -s -v -rs tests/test_struct_layout.py

      - name: Unit Tests (FUSE 2)
        if: startsWith( matrix.os, 'ubuntu' )
        run: |
          python3 -c 'import mfusepy; assert mfusepy.fuse_version_major == 2'
          python3 -m pytest -v -rs tests

      - name: Unit Tests (FUSE 3)
        if: startsWith( matrix.os, 'ubuntu' )
        run: |
          # The package name depends on the soname: libfuse3-3 up to Ubuntu 24.04, libfuse3-4 since Ubuntu 26.04.
          export FUSE_LIBRARY_PATH=$( ldconfig -p | awk '/libfuse3[.]so[.][0-9]+ /{ print $NF; exit }' )
          python3 -c 'import mfusepy; assert mfusepy.fuse_version_major == 3'
          python3 -m pytest -v -rs tests

      - name: Test Compatibility (Ratarmount)
        if: startsWith( matrix.os, 'ubuntu' )
        run: |
          uv pip install ratarmount
          uv pip install --reinstall-package mfusepy .
          mkdir -p mounted-tar
          ratarmount tests/single-file.tar mounted-tar
          [[ "$( cat mounted-tar/bar )" == "foo" ]]
          fusermount -u mounted-tar

      - name: Test Compatibility (ninfs)
        if: ${{ startsWith( matrix.os, 'ubuntu' ) && matrix.python-version != '3.7' }}
        run: |
          # https://github.com/ihaveamac/ninfs/commit/9554caa5ecb325a9893bce829fb17efc73d3622c
          # ^ Increases requirement from 3.8 to 3.12 seemingly for no reason at all. There is no commit after it...
          uv pip install git+https://github.com/ihaveamac/ninfs.git@v2.0
          uv pip install --reinstall-package mfusepy .
          mkdir -p mounted-3dsx
          ninfs threedsx tests/3dsfetch.3dsx mounted-3dsx
          [[ "$( md5sum mounted-3dsx/icon.smdh )" =~ "a3d784b6f20182ebdf964589cbf427c2" ]]
          fusermount -u mounted-3dsx

  VM-Tests:
    # Run tests inside a VM using cross-platform-actions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
         include:
           - os: freebsd
             version: '14.5'
             display_name: FreeBSD
           - os: freebsd
             version: '15.1'
             display_name: FreeBSD
           - os: openbsd
             version: '7.9'
             display_name: OpenBSD
           - os: openbsd
             version: '7.8'
             display_name: OpenBSD
           # OpenBSD 6.9 is not supported because it only has Python 3.8, which is not supported anymore.
           # NetBSD 9.4 is not supported because its interface seems to mirror libFUSE 2.6 and therefore is HIGHLY
           #            incompatible. Even fuse_context.umask is missing!
           - os: netbsd
             version: '11.0'
             display_name: NetBSD
           - os: netbsd
             version: '10.1'
             display_name: NetBSD
           - os: omnios
             version: r151058
             display_name: OmniOS

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Start VM on ${{ matrix.display_name }}
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          # The shell that cpa.sh uses to run the script of subsequent custom-shell steps inside the VM
          shell: bash

      - name: Test on ${{ matrix.display_name }}
        shell: cpa.sh {0}
        run: |
            set -euxo pipefail
            case "${{ matrix.os }}" in
              freebsd)
                # Ensure a proper hostname/FQDN is set (VMs may not have one by default)
                sudo -E /bin/sh -c 'grep -q "freebsd\.local" /etc/hosts || echo "127.0.0.1 freebsd.local freebsd" >> /etc/hosts'
                sudo -E hostname freebsd.local
                hostname

                # Keep pkg from aborting on minor version drift
                export IGNORE_OSVERSION=yes

                # Packages
                sudo -E pkg update -f
                # Ports only package pip for the default Python version, which differs between
                # FreeBSD versions and changes over time, e.g. py311-pip on 13.5 but py312-pip
                # on 14.3, so install it via its unflavored port origin instead of by name.
                sudo -E pkg install -y git fusefs-libs python3 devel/py-pip

                # Make FUSE work
                sudo -E kldload fusefs
                sudo -E sysctl vfs.usermount=1
                sudo -E chmod 666 /dev/fuse

                # Install pip Dependencies
                # FreeBSD's devel/py-pip is 23.3.2, older than pip 25.1, which introduced --group, so the
                # dependencies are still listed explicitly here. Keep them in sync with [dependency-groups].test.
                python3 -m pip install pytest pytest-order ioctl-opt

                # Test Installation From Source
                python3 -m pip install .

                # Unit Tests (FUSE 2)
                python3 -c 'import mfusepy; assert mfusepy.fuse_version_major == 2'
                python3 -m pytest -s -v -rs tests
                ;;
              openbsd)
                # Ensure a proper hostname/FQDN is set (VMs may not have one by default)
                sudo -E /bin/sh -c 'grep -q "openbsd\.local" /etc/hosts || echo "127.0.0.1 openbsd.local openbsd" >> /etc/hosts'
                sudo -E hostname openbsd.local
                hostname

                # Packages
                sudo -E pkg_add git py3-pip py3-virtualenv py3-tox
                sudo -E pkg_add sshfs-fuse  # needed for sideeffect of having fuse 2.6?

                # Install pip Dependencies
                # The venv's pip comes from the interpreter's bundled ensurepip and may predate --group
                # (pip 25.1), so the dependencies are still listed explicitly here.
                # Keep them in sync with [dependency-groups].test in pyproject.toml.
                python3 -m venv .venv
                source .venv/bin/activate
                python3 -m pip install pytest pytest-order ioctl-opt

                # Test Installation From Source
                python3 -m pip install .

                # Unit Tests (FUSE 2)
                python3 -c 'import mfusepy; assert mfusepy.fuse_version_major == 2'

                # FUSE mounting only works as root on OpenBSD
                sudo -E .venv/bin/python3 -m pytest -s -v -rs tests
                ;;
              netbsd)
                # Ensure a proper hostname/FQDN is set (VMs may not have one by default)
                sudo -E /bin/sh -c 'grep -q "netbsd\.local" /etc/hosts || echo "127.0.0.1 netbsd.local netbsd" >> /etc/hosts'
                sudo -E hostname netbsd.local
                hostname

                # Packages
                sudo -E pkgin -y update
                # librefuse (FUSE API on top of puffs, no perfused daemon needed) is part of the NetBSD base system.
                sudo -E pkgin -y install git python311 py311-pip
                sudo -E ln -sf /usr/pkg/bin/python3.11 /usr/pkg/bin/python3

                # Fix PATH
                export PATH="/usr/pkg/bin:/usr/pkg/sbin:/sbin:/usr/sbin:$PATH"

                # Make FUSE work (NetBSD)
                sudo sysctl -w vfs.generic.usermount=1
                sudo sysctl -w kern.sbmax=4194304
                sudo chmod 666 /dev/puffs

                # Install pip Dependencies
                # The pkgin-provided pip supports PEP 735 --group (pip 25.1 and later).
                python3 -m pip install --group test

                # Test Installation From Source
                python3 -m pip install .

                # preserve pytest exit status, always show logs
                rc=0
                python3 -m pytest -s -v -rs tests/test_struct_layout.py
                # for now, run the tests as root, too many PermissionErrors:
                sudo -E python3 -m pytest -s -v -rs tests || rc=$?
                exit "$rc"
                ;;
              omnios)
                # Ensure a proper hostname/FQDN is set (VMs may not have one by default)
                pfexec /bin/sh -c 'grep -q "omnios\.local" /etc/hosts || echo "127.0.0.1 omnios.local omnios" >> /etc/hosts'
                pfexec hostname omnios.local
                hostname

                # Packages
                pfexec pkg install developer/versioning/git developer/gcc14
                pfexec pkg set-mediator -V 14 gcc

                # FUSE kernel driver (illumos-fusefs), built for this OmniOS release by omnios-extra.
                # Do not use the SFE fusefs package: it was built for r151046 and panics newer kernels in
                # fuse_statvfs (NULL pointer dereference in strlen).
                pkg publisher extra.omnios || pfexec pkg set-publisher -g "https://pkg.omnios.org/${{ matrix.version }}/extra/" extra.omnios
                pfexec pkg install ooce/driver/fuse
                ls -l /dev/fuse

                # libfuse is not packaged for OmniOS: build the Solaris port of libfuse 2.7 that comes with illumos-fusefs.
                pushd /tmp
                curl -fsSL https://raw.githubusercontent.com/jurikm/illumos-fusefs/Version-1.6/lib/libfuse-20100615.tgz | gzip -dc | tar xf -
                cd libfuse
                gcc -m64 -O2 -fPIC -std=gnu99 -Iinclude \
                    -D__SOLARIS__ -D_XOPEN_SOURCE=600 -D__EXTENSIONS__ -D_FILE_OFFSET_BITS=64 -DFUSE_USE_VERSION=26 \
                    -DFUSERMOUNT_DIR='"/usr/gnu/bin"' \
                    -shared -Wl,-h,libfuse.so.2 -Wl,-zdefs -o libfuse.so.2.7.1 \
                    fuse.c fuse_kern_chan.c fuse_loop.c fuse_loop_mt.c fuse_lowlevel.c fuse_mt.c fuse_opt.c \
                    fuse_session.c fuse_signals.c helper.c mount.c daemon.c mount_util.c modules/iconv.c modules/subdir.c \
                    -lxnet
                pfexec mkdir -p /usr/gnu/lib/amd64 /usr/gnu/include/fuse
                pfexec cp libfuse.so.2.7.1 /usr/gnu/lib/amd64/
                pfexec ln -sf libfuse.so.2.7.1 /usr/gnu/lib/amd64/libfuse.so.2
                pfexec ln -sf libfuse.so.2.7.1 /usr/gnu/lib/amd64/libfuse.so
                pfexec cp include/fuse.h include/fuse_common.h include/fuse_common_compat.h include/fuse_compat.h \
                    include/fuse_lowlevel.h include/fuse_lowlevel_compat.h include/fuse_opt.h /usr/gnu/include/fuse/
                popd

                # Install pip Dependencies
                # The pip version in this image is not known to support --group (pip 25.1), so the
                # dependencies are still listed explicitly here. Keep them in sync with [dependency-groups].test.
                python3 -m pip install pytest pytest-order ioctl-opt

                # Fix PATH
                export PATH="/home/runner/.local/bin:$PATH"
                echo $PATH

                # Test Installation From Source
                python3 -m pip install .

                # Unit Tests (FUSE 2)
                python3 -c 'import mfusepy; assert mfusepy.fuse_version_major == 2'
                # preserve pytest exit status, always show logs
                rc=0
                pfexec python3 -m pytest -v -rs tests || rc=$?
                exit "$rc"
                ;;
            esac
